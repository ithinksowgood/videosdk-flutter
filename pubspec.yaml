name: videosdk
description: Video SDK Flutter to simply integrate Audio & Video Calling API or Live Video Streaming API to your app with just a few lines of code.
version: 3.12.1
homepage: "https://videosdk.live/"
documentation: https://docs.videosdk.live/
# publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  random_string: ^2.3.1
  collection: ^1.18.0
  sdp_transform: ^0.3.2
  h264_profile_level_id: ^0.2.0
  flutter_foreground_task: ^9.1.0
  synchronized: ^3.3.0
  http: ^1.2.2
  encrypt: ^5.0.3
  videosdk_room_stats: 0.0.6
  videosdk_otel: ^0.0.3
  dart_webrtc: ^1.5.1
  device_info_plus: ">=12.3.0 <14.0.0"
  platform_detect: ^2.1.0
  web: ^1.1.1
  permission_handler: ">=12.0.1 <14.0.0"
  videosdk_webrtc: 0.0.19
  image: ^4.5.4
  socket_io_client: 3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  dartdoc: 9.0.2

# The following section is specific to Flutter.
flutter:

  plugin:
    platforms:
      android:
        package: live.videosdk.videosdk
        pluginClass: VideosdkPlugin
      ios:
        pluginClass: VideosdkPlugin
      macos:
        pluginClass: VideosdkPlugin
      windows:
        pluginClass: VideosdkPluginCApi
      web:
        pluginClass: VideosdkWeb
        fileName: videosdk_web.dart